<html>

<head>
    <meta charset="utf-8">
    <!--
        Customize this policy to fit your own app's needs. For more guidance, please refer to the docs:
            https://cordova.apache.org/docs/en/latest/
        Some notes:
            * https://ssl.gstatic.com is required only on Android and is needed for TalkBack to function properly
            * Disables use of inline scripts in order to mitigate risk of XSS vulnerabilities. To change this:
                * Enable inline JS: add 'unsafe-inline' to default-src
        -->
    <!-- <meta http-equiv="Content-Security-Policy" content="default-src 'self' data: https://ssl.gstatic.com 'unsafe-eval'; style-src 'self' 'unsafe-inline'; media-src *; img-src 'self' data: content:;"> -->
    <meta name="format-detection" content="telephone=no">
    <meta name="msapplication-tap-highlight" content="no">
    <meta name="viewport" content="initial-scale=1, width=device-width, viewport-fit=cover">
    <meta name="color-scheme" content="light">

    <link rel="icon" type="image/x-icon" href="img/favicon.ico">
    <title>Aguas! - Crear reporte</title>

    <!-- Styles -->
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Leaflet maps -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
</head>

<body>
    <div class="decorative-header">
        <span>Creación de Reporte</span>
    </div>

    <div id="alert-placeholder"></div>
    <div id="navbar"></div>

    <div class="container mt-4 pb-5 container-custom" style="margin-top: 80px;">

        <!-- Mapita -->
        <section id="location-map" class="mb-4">
            <div id="map" class="w-100" style="height: 200px; background-color: #e0e0e0; border-radius: 8px;"></div>
            <button id="btn-map-select" class="btn btn-primary w-100 mt-2">Seleccionar ubicación</button>
            <p id="address" class="text-center mt-2"></p>
        </section>

        <!-- Formulario -->
        <section id="location-form">
            <form action="#" method="post" id="form-create-report" class="row g-3 form-container">
                <input type="hidden" name="Latitude" id="Latitude" required>
                <input type="hidden" name="Longitude" id="Longitude" required>

                <!-- Fila para los campos de "Número de casa" y "Calle" -->
                <div class="row g-3"> <!-- Aquí agrupamos los dos campos en una fila -->
                    <div class="col-6">
                        <label for="HouseNumber" class="form-label">Num de casa</label>
                        <input type="text" name="HouseNumber" id="HouseNumber" class="form-control" required maxlength="10">
                    </div>

                    <div class="col-6">
                        <label for="Street" class="form-label">Calle</label>
                        <input type="text" name="Street" id="Street" class="form-control" required maxlength="50">
                    </div>
                </div>

                <div class="col-md-6">
                    <label for="Neighborhood" class="form-label">Colonia</label>
                    <input type="text" name="Neighborhood" id="Neighborhood" class="form-control" required maxlength="50">
                </div>

                <div class="col-md-6">
                    <label for="IdReportType" class="form-label">Tipo de reporte</label>
                    <select name="IdReportType" id="IdReportType" class="form-select" required>
                        <option value="" disabled selected>Seleccione un tipo de reporte</option>
                    </select>
                </div>

                <div class="col-12">
                    <label for="Description" class="form-label">Descripción</label>
                    <textarea name="Description" id="Description" class="form-control" required placeholder="Información acerca del reporte" maxlength="300" rows="2"></textarea>
                </div>

                <div class="col-12 text-center">
                    <input type="submit" value="Enviar" class="btn btn-success w-50">
                </div>
            </form>
        </section>
    </div>



    <!-- Scripts -->
    <script src="cordova.js"></script>
    <script src="js/bootstrap.min.js"></script>
    <script src="js/jquery.min.js"></script>
    <script src="js/routes.js"></script>
    <script src="js/alert.js"></script>
    <script src="js/create-report.js"></script>

    <!-- Script views -->
    <script src="js/views.js"></script>
    <script>
        loadView('navbar', 'navbar');
        document.addEventListener('gesturestart', (event) => { event.preventDefault(); }, false);
    </script>
</body>

</html>
