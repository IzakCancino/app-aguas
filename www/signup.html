<html>

<head>
    <meta charset="utf-8">
    <!--
        Customize this policy to fit your own app's needs. For more guidance, please refer to the docs:
            https://cordova.apache.org/docs/en/latest/
        Some notes:
            * https://ssl.gstatic.com is required only on Android and is needed for TalkBack to function properly
            * Disables use of inline scripts in order to mitigate risk of XSS vulnerabilities. To change this:
                * Enable inline JS: add 'unsafe-inline' to default-src
        -->
    <!-- <meta http-equiv="Content-Security-Policy" content="default-src 'self' data: https://ssl.gstatic.com 'unsafe-eval'; style-src 'self' 'unsafe-inline'; media-src *; img-src 'self' data: content:;"> -->
    <meta name="format-detection" content="telephone=no">
    <meta name="msapplication-tap-highlight" content="no">
    <meta name="viewport" content="initial-scale=1, width=device-width, viewport-fit=cover">
    <meta name="color-scheme" content="light">

    <link rel="icon" type="image/x-icon" href="img/favicon.ico">
    <title>Aguas! - Crear cuenta</title>

    <!-- Styles -->
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>
    <div id="charging-spinner">
        <div class="dot-spinner">
            <div class="dot-spinner__dot"></div>
            <div class="dot-spinner__dot"></div>
            <div class="dot-spinner__dot"></div>
            <div class="dot-spinner__dot"></div>
            <div class="dot-spinner__dot"></div>
            <div class="dot-spinner__dot"></div>
            <div class="dot-spinner__dot"></div>
            <div class="dot-spinner__dot"></div>
        </div>
    </div>

    <div id="alert-placeholder"></div>

    <div class="signup">
        <div class="hader">
            <span>¡Únete a esta comunidad!</span>
            <p>Regístrate ahora.</p>
        </div>
        <form id="signupForm">
            <input id="name" type="text" placeholder="Ingresa tu nombre" required minlength="3" maxlength="50" />
            <input id="lastName" type="text" placeholder="Ingresa tu apellido" required minlength="3" maxlength="50" />
            <input id="email" type="email" placeholder="Ingresa tu correo electrónico" required maxlength="320" />
            <input id="password" type="password" placeholder="Elige una contraseña" required minlength="5" maxlength="50" />
            <input type="submit" value="Regístrate" />
            <span> ¿Ya eres miembro? <a href="login.html">Inicia sesión aquí</a></span>
            <a href="index.html" class="btn btn-secondary">
                <i class="bi bi-arrow-left" title="Regresar"></i>
            </a>
        </form>

    </div>

    <!-- Scripts -->
    <script src="cordova.js"></script>
    <script src="js/bootstrap.min.js"></script>
    <script src="js/jquery.min.js"></script>
    <script src="js/routes.js"></script>
    <script src="js/alert.js"></script>
    <script src="js/signup.js"></script>

    <script>
        document.addEventListener('gesturestart', (event) => { event.preventDefault(); }, false);
    </script>
</body>

</html>
