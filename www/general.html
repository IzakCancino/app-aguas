<html>

<head>
    <meta charset="utf-8">
    <!--
        Customize this policy to fit your own app's needs. For more guidance, please refer to the docs:
            https://cordova.apache.org/docs/en/latest/
        Some notes:
            * https://ssl.gstatic.com is required only on Android and is needed for TalkBack to function properly
            * Disables use of inline scripts in order to mitigate risk of XSS vulnerabilities. To change this:
                * Enable inline JS: add 'unsafe-inline' to default-src
    -->
    <!-- <meta http-equiv="Content-Security-Policy" content="default-src 'self' data: https://ssl.gstatic.com 'unsafe-eval'; style-src 'self' 'unsafe-inline'; media-src *; img-src 'self' data: content:;"> -->
    <meta name="format-detection" content="telephone=no">
    <meta name="msapplication-tap-highlight" content="no">
    <meta name="viewport" content="initial-scale=1, width=device-width, viewport-fit=cover">
    <meta name="color-scheme" content="light">

    <link rel="icon" type="image/x-icon" href="img/favicon.ico">
    <title>Aguas! - General</title>

    <!-- Styles -->
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Leaflet maps -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
</head>

<body>
    <div id="charging-spinner">
        <div class="dot-spinner">
            <div class="dot-spinner__dot"></div>
            <div class="dot-spinner__dot"></div>
            <div class="dot-spinner__dot"></div>
            <div class="dot-spinner__dot"></div>
            <div class="dot-spinner__dot"></div>
            <div class="dot-spinner__dot"></div>
            <div class="dot-spinner__dot"></div>
            <div class="dot-spinner__dot"></div>
        </div>
    </div>

    <div class="decorative-header">
        <span>Reportes ciudadanos</span>
    </div>

    <div id="alert-placeholder"></div>
    <div id="navbar"></div>

    <button type="button" id="btn-report-browse" class="btn btn-primary" data-bs-dismiss="modal" data-bs-toggle="modal" data-bs-target="#staticBackdrop">
        <i class="bi bi-search text-white"></i>
    </button>

    <div id="map" style="height: calc(100% - 112px); width: 100vw;"></div>

    <!-- Modal browse -->
    <div class="modal fade" id="staticBackdrop" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-labelledby="staticBackdropLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="staticBackdropLabel">Búsqueda de Reportes</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form method="get" action="general.html" id="form-browser">
                        <input type="hidden" name="browse" value="1">
                        <div class="mb-3">
                            <label for="idOrganization" class="form-label">Seleccione la organización</label>
                            <select name="idOrganization" id="idOrganization" class="form-select" required>
                                <option value="0" selected>Todas</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="status" class="form-label">Estado del Reporte</label>
                            <select class="form-select" id="status" name="status" required>
                                <option value="0">Todos</option>
                                <option value="1">1 - Pendiente</option>
                                <option value="2">2 - En proceso</option>
                                <option value="3">3 - Resuelto</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="daysAgo" class="form-label">Tiempo desde la creación</label>
                            <select class="form-select" id="daysAgo" name="daysAgo" required>
                                <option value="0">Todo el tiempo</option>
                                <option value="1">Un día</option>
                                <option value="7">Una semana</option>
                                <option value="30">Un mes</option>
                            </select>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="submit" form="form-browser" id="btn-report-save" class="btn btn-success">Buscar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="cordova.js"></script>
    <script src="js/bootstrap.min.js"></script>
    <script src="js/jquery.min.js"></script>
    <script src="js/routes.js"></script>
    <script src="js/alert.js"></script>
    <script src="js/general.js"></script>

    <!-- Script views -->
    <script src="js/views.js"></script>
    <script>
        loadView('navbar', 'navbar');
        document.addEventListener('gesturestart', (event) => { event.preventDefault(); }, false);
    </script>
</body>

</html>
